name: Build LEVEL UP NEXUS for Windows x64

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
          pnpm --version

      - name: Install frontend dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Setup Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Download and verify FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip'
          $expected = '60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba'
          $downloadDir = Join-Path $env:RUNNER_TEMP 'nexus-ffmpeg'
          $archive = Join-Path $downloadDir 'ffmpeg.zip'
          $extractDir = Join-Path $downloadDir 'extracted'
          New-Item -ItemType Directory -Force -Path $downloadDir, $extractDir | Out-Null
          $maxAttempts = 5
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $archive
              break
            } catch {
              Remove-Item $archive -Force -ErrorAction SilentlyContinue
              if ($attempt -eq $maxAttempts) { throw }
              $delay = [Math]::Pow(2, $attempt)
              Write-Host "FFmpeg download attempt $attempt failed; retrying in $delay seconds. $($_.Exception.Message)"
              Start-Sleep -Seconds $delay
            }
          }
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "FFmpeg archive checksum mismatch. Expected $expected but got $actual"
          }
          Expand-Archive -Path $archive -DestinationPath $extractDir -Force
          $ffmpeg = Get-ChildItem -Path $extractDir -Recurse -Filter 'ffmpeg.exe' | Select-Object -First 1
          if (-not $ffmpeg) { throw 'ffmpeg.exe was not found after extraction' }
          New-Item -ItemType Directory -Force -Path 'src-tauri/binaries' | Out-Null
          Copy-Item $ffmpeg.FullName 'src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe' -Force

      - name: Verify Windows Sidecars
        shell: pwsh
        run: pnpm verify:sidecars

      - name: Smoke-test real yt-dlp download
        shell: pwsh
        run: node scripts/yt-dlp-smoke-test.mjs

      - name: Check frontend
        shell: pwsh
        run: |
          pnpm check
          pnpm test

      - name: Test Rust backend
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri Windows bundle
        shell: pwsh
        run: pnpm tauri build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: level-up-nexus-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
