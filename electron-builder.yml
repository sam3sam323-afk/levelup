appId: com.leveluparena.nexus
productName: LEVEL UP ARENA NEXUS
asar: true
compression: maximum
electronVersion: 45.0.0
electronLanguages:
  - ar
  - en-US
includePdb: false
publish:
  provider: github
  owner: sam3sam323-afk
  repo: levelup
directories:
  app: desktop/runtime
  output: release/win
files:
  - "**/*"
  - "!**/*.map"
  - "!**/*.pdb"
extraResources:
  - from: binaries/win-x64
    to: binaries/win-x64
    filter:
      - '**/*'
  - from: web-dist
    to: web-dist
    filter:
      - '**/*'
  - from: licenses
    to: licenses
    filter:
      - '**/*'
  - from: assets/images/icon.ico
    to: app-icon.ico
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/images/icon.ico
  artifactName: LEVEL-UP-ARENA-NEXUS-Setup-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LEVEL UP ARENA NEXUS
  installerIcon: assets/images/icon.ico
  installerHeaderIcon: assets/images/icon.ico
  uninstallerIcon: assets/images/icon.ico
  runAfterFinish: true
  useZip: false
  differentialPackage: true
